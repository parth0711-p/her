<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A pink flower with hearts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9f1"/>
      <stop offset="1" stop-color="#ffd3e3"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ee6a9a"/>
      <stop offset="0.5" stop-color="#fb9dbd"/>
      <stop offset="1" stop-color="#ffd2e2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c8c3a"/>
      <stop offset="1" stop-color="#78d889"/>
    </linearGradient>
    <radialGradient id="mid" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.6" stop-color="#ffc53d"/>
      <stop offset="1" stop-color="#ff8f2a"/>
    </radialGradient>
    <path id="heart" d="M0 -3 C-6 -10 -14 -2 0 8 C14 -2 6 -10 0 -3 Z"/>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- stem + leaves -->
  <path d="M100 196 C98 160 102 130 100 104" fill="none" stroke="#1f9a3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 160 C118 150 134 152 146 140 C132 138 112 142 100 160 Z" fill="url(#leaf)" stroke="#106428" stroke-opacity=".4"/>
  <path d="M100 172 C82 162 66 164 54 152 C68 150 88 154 100 172 Z" fill="url(#leaf)" stroke="#106428" stroke-opacity=".4"/>

  <!-- flower -->
  <g transform="translate(100 82)">
    <g id="petals" fill="url(#petal)" stroke="#d64e80" stroke-opacity=".35" stroke-width="1.2">
      <ellipse cx="0" cy="-30" rx="17" ry="30"/>
      <ellipse cx="0" cy="-30" rx="17" ry="30" transform="rotate(72)"/>
      <ellipse cx="0" cy="-30" rx="17" ry="30" transform="rotate(144)"/>
      <ellipse cx="0" cy="-30" rx="17" ry="30" transform="rotate(216)"/>
      <ellipse cx="0" cy="-30" rx="17" ry="30" transform="rotate(288)"/>
    </g>
    <circle r="15" fill="url(#mid)"/>
    <circle cx="-4" cy="-5" r="5" fill="#fff" fill-opacity=".45"/>
  </g>

  <!-- floating hearts -->
  <g fill="#f06292">
    <use href="#heart" transform="translate(32 40) scale(.9)" opacity=".9"/>
    <use href="#heart" transform="translate(166 58) scale(.7)" opacity=".75"/>
    <use href="#heart" transform="translate(40 120) scale(.55)" opacity=".6"/>
    <use href="#heart" transform="translate(164 132) scale(.8)" opacity=".85"/>
  </g>
</svg>
