<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flowers for you 🌸</title>
  <meta name="theme-color" content="#8ccbe9">

  <!-- Poppins is the font used in the video. Falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The whole garden (sun, grass, leaves, flowers, sparkles) is drawn on this canvas -->
  <canvas id="garden" aria-hidden="true"></canvas>

  <!-- Message + button that appear after the flowers have grown -->
  <main class="stage">
    <p id="message" class="message"></p>
    <button id="openLetter" class="letter-btn" type="button"></button>
  </main>

  <!-- The letter pop-up -->
  <div id="letterModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <article class="letter">
      <button id="closeLetter" class="letter__close" type="button" aria-label="Close letter">&times;</button>
      <h2 id="letterTitle" class="letter__title"></h2>
      <figure class="letter__photo"><img id="letterPhoto" alt=""></figure>
      <div id="letterBody" class="letter__body"></div>
      <p id="letterSign" class="letter__sign"></p>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
